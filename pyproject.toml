[project]
name = "rolescout"
version = "0.1.0"
description = "Agentic job-search engine: fetch, score, rank, and browse relevant jobs."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.0",
    "pydantic-settings[yaml]>=2.0",
    "sqlmodel>=0.0.21",
    "httpx>=0.27",
    "streamlit>=1.35",
    "rich>=13.0",
    "click>=8.1",
    "typesafe-sdk>=0.7.1",
]

[project.scripts]
rolescout = "rolescout.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
